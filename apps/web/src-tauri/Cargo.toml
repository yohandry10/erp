[package]
name = "erp-suite-desktop"
version = "1.0.0"
description = "ERP Suite Desktop - Sistema Tributario Peruano"
authors = ["ERP Suite Team"]
license = "MIT"
repository = "https://github.com/org/erp-suite"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "erp_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

# Tauri dependencies
tauri = { version = "2.6.2", features = ["tray-icon"] }
tauri-plugin-log = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
