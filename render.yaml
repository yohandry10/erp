# ============================================================================
# Blueprint de Render para la API.
#
# El front vive en Vercel: Next.js encaja ahi y la API no, porque necesita un
# proceso largo con Redis y trabajos en segundo plano.
#
# El Key Value (Redis) se crea aparte y se conecta por REDIS_HOST: el
# identificador del servicio es su nombre de host en la red interna de Render.
# ============================================================================
services:
  - type: web
    name: erp-api
    runtime: docker
    # La API contiene workers cron/outbox: una instancia que se duerme rompe su
    # contrato operativo. Aplicar este cambio en Render sí implica costo y debe
    # aprobarse al promover el Blueprint; este commit no despliega nada.
    plan: starter
    region: oregon
    branch: main
    # Render sólo construye main después de que CI, PostgreSQL y Playwright
    # hayan pasado; un commit con esquema/pruebas rotos no inicia despliegue.
    autoDeployTrigger: checksPass
    # El Dockerfile copia package.json, pnpm-workspace.yaml, libs/ y apps/erp-api
    # desde la raiz: el contexto tiene que ser el repo entero, no apps/erp-api.
    dockerfilePath: ./apps/erp-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_ENV
        value: PROD
      - key: PORT
        value: 3002

      # La prueba gratuita vive en produccion: el cliente prueba con su cuenta y
      # al activarla conserva lo que cargo.
      - key: DEMO_API_ENABLED
        value: true
      # Los módulos cerrados para Perú quedan activos por defecto. Una
      # desactivación de emergencia debe ser explícita en el panel.
      - key: FEATURE_RRHH_ENABLED
        value: true
      - key: FEATURE_POS_ENABLED
        value: true
      - key: FEATURE_INVENTARIO_ENABLED
        value: true

      # Con NODE_ENV=production el arranque exige Redis disponible.
      - key: REDIS_REQUIRED
        value: true
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false

      # Los dos propietarios del outbox hacen catch-up al arrancar y luego
      # procesan por cron. Readiness falla si el contrato/ACL o el backlog
      # exceden estos límites; nunca muta la base para comprobarla.
      - key: OUTBOX_WORKER_CRON_ENABLED
        value: true
      - key: ACCOUNTING_OUTBOX_WORKER_CRON_ENABLED
        value: true
      - key: OUTBOX_READY_MAX_CLAIMABLE
        value: 5000
      - key: OUTBOX_READY_MAX_OLDEST_SECONDS
        value: 900
      - key: OUTBOX_READY_MAX_DEAD_LETTER
        value: 100
      - key: OUTBOX_READY_STALE_SECONDS
        value: 900
      # Readiness compara este valor con la historia real de migraciones. El
      # contenedor no recibe tráfico si PROD aún no alcanzó este esquema.
      - key: REQUIRED_DATABASE_SCHEMA_VERSION
        value: 498

      # Base de datos de produccion. EXPECTED_SUPABASE_PROJECT_REF hace que la
      # API se niegue a arrancar si la apuntan a otro proyecto por error.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EXPECTED_SUPABASE_PROJECT_REF
        sync: false
      - key: DATABASE_URL
        sync: false

      # Los genera Render: valores de 256 bits que no pasan por ninguna otra
      # mano. Si alguna vez se filtran, se rotan desde el panel.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: AUTH_SIGNATURE_SECRET
        generateValue: true
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      # Cifra los certificados de cada tenant en la base. Cambiarla deja
      # ilegibles los ya guardados, asi que se fija una vez y no se rota a la
      # ligera.
      - key: ENCRYPTION_KEY
        generateValue: true

      # Origen del front, para CORS y para los enlaces que se envian al cliente.
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
