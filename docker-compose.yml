version: '3.8'

services:
  # ============================================
  # ERP API (NestJS Backend)
  # ============================================
  erp-api:
    build:
      context: .
      dockerfile: apps/erp-api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PFX_PATH=/app/certs/demo.pfx
      - PFX_PASS=${PFX_PASS}
      - OSE_URL=${OSE_URL}
      - OSE_USERNAME=${OSE_USERNAME}
      - OSE_PASSWORD=${OSE_PASSWORD}
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Redis (Cache & Queues)
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Worker (Background Jobs)
  # ============================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - REDIS_URL=redis://redis:6379
      - OSE_URL=${OSE_URL}
      - OSE_USERNAME=${OSE_USERNAME}
      - OSE_PASSWORD=${OSE_PASSWORD}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - erp-api
    restart: unless-stopped

  # ============================================
  # Prometheus (Métricas)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - erp-api

  # ============================================
  # Grafana (Visualización)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: erp-grafana
    ports:
      - "3300:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3300
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  # ============================================
  # Redis Exporter (Métricas de Redis)
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: erp-redis-exporter
    ports:
      - "9122:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis

  # ============================================
  # Node Exporter (Métricas del Sistema)
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: erp-node-exporter
    ports:
      - "9101:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: erp-network 
