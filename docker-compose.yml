services:
  # ============================================
  # ERP Web (Next.js Frontend)
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3002
      - SERVER_API_URL=http://erp-api:3002
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_FEATURE_POS_ENABLED=${FEATURE_POS_ENABLED}
      - NEXT_PUBLIC_FEATURE_INVENTARIO_ENABLED=${FEATURE_INVENTARIO_ENABLED}
      - NEXT_PUBLIC_FEATURE_RRHH_ENABLED=${FEATURE_RRHH_ENABLED}
    depends_on:
      erp-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.get('http://localhost:3001/dashboard/', (res)=>process.exit(res.statusCode < 500 ? 0 : 1)); req.on('error', ()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # ERP API (NestJS Backend)
  # ============================================
  erp-api:
    build:
      context: .
      dockerfile: apps/erp-api/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PFX_PATH=/app/certs/demo.pfx
      - PFX_PASS=${PFX_PASS}
      - AUTH_SIGNATURE_SECRET=${AUTH_SIGNATURE_SECRET}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CERT_ENCRYPTION_KEY=${CERT_ENCRYPTION_KEY}
      - CERT_ENCRYPTION_KEY_OLD=${CERT_ENCRYPTION_KEY_OLD:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - HEALTH_TOKEN=${HEALTH_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001}
      - FEATURE_POS_ENABLED=${FEATURE_POS_ENABLED:-true}
      - FEATURE_INVENTARIO_ENABLED=${FEATURE_INVENTARIO_ENABLED:-true}
      - FEATURE_RRHH_ENABLED=${FEATURE_RRHH_ENABLED:-true}
      - CERTIFICATE_PATH=/app/certs/demo.pfx
      - CERTIFICATE_PASSWORD=${PFX_PASS}
      - OSE_URL=${OSE_URL}
      - OSE_USERNAME=${OSE_USERNAME}
      - OSE_PASSWORD=${OSE_PASSWORD}
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.PORT||'3002'; const http=require('http'); const headers=process.env.HEALTH_TOKEN?{'x-health-token':process.env.HEALTH_TOKEN}:{}; const req=http.get({hostname:'localhost',port,path:'/api/health',headers}, (res)=>process.exit(res.statusCode===200?0:1)); req.on('error', ()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Redis (Cache & Queues)
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Worker (Background Jobs)
  # ============================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - FEATURE_POS_ENABLED=${FEATURE_POS_ENABLED:-true}
      - FEATURE_INVENTARIO_ENABLED=${FEATURE_INVENTARIO_ENABLED:-true}
      - FEATURE_RRHH_ENABLED=${FEATURE_RRHH_ENABLED:-true}
      - ERP_API_URL=http://erp-api:3002/api
      - WORKER_PORT=3050
      - POS_WORKER_JWT_SECRET=${POS_WORKER_JWT_SECRET}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CERT_ENCRYPTION_KEY=${CERT_ENCRYPTION_KEY}
      - CERT_ENCRYPTION_KEY_OLD=${CERT_ENCRYPTION_KEY_OLD:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - HEALTH_TOKEN=${HEALTH_TOKEN}
      - OSE_URL=${OSE_URL}
      - OSE_USERNAME=${OSE_USERNAME}
      - OSE_PASSWORD=${OSE_PASSWORD}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - erp-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const headers=process.env.HEALTH_TOKEN?{'x-health-token':process.env.HEALTH_TOKEN}:{}; const req=http.get({hostname:'localhost',port:3050,path:'/health',headers}, (res)=>process.exit(res.statusCode===200?0:1)); req.on('error', ()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Prometheus (Métricas)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - erp-api

  # ============================================
  # Grafana (Visualización)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: erp-grafana
    ports:
      - "3300:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3300
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  # ============================================
  # Redis Exporter (Métricas de Redis)
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: erp-redis-exporter
    ports:
      - "9122:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis

  # ============================================
  # Node Exporter (Métricas del Sistema)
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: erp-node-exporter
    ports:
      - "9101:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: erp-network
