# Security scanning workflow
# Q60: Dependency scanning for CVEs in CI/CD

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit (root)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (erp-api)
        working-directory: apps/erp-api
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (web)
        working-directory: apps/web
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (worker)
        working-directory: apps/worker
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for critical vulnerabilities
        shell: bash
        run: |
          echo "Checking for CRITICAL vulnerabilities..."
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if output=$(pnpm audit --audit-level=critical 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if ! grep -Eq 'ERR_SOCKET_TIMEOUT|ECONNRESET|ETIMEDOUT|EAI_AGAIN|error \(5[0-9]{2}\)' <<<"$output"; then
              exit "$status"
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              exit "$status"
            fi

            echo "Transient npm registry failure; retrying audit ($attempt/$max_attempts)..."
            sleep $((attempt * 15))
          done
        # This will fail the build if there are critical vulnerabilities

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
