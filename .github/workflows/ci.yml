name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Monorepo type-check
        run: pnpm type-check

      - name: Worker type-check
        run: pnpm -C apps/worker type-check

      - name: Worker build
        run: pnpm -C apps/worker build

      - name: API build
        run: pnpm -C apps/erp-api build

      - name: API tests
        run: pnpm -C apps/erp-api test

      - name: Audit (critical)
        run: pnpm audit --audit-level=critical
