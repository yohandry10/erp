name: CI

on:
  # Solo con main y develop, ninguna rama de trabajo pasaba por CI: se llegaba a
  # la PR con el pipeline sin haberse ejecutado una sola vez.
  push:
    branches:
      - main
      - develop
      - "codex/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes que setup-node: la cache de pnpm necesita el binario ya en
      # PATH, y al reves el job moria con "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resumen de CI
        run: |
          echo "## CI: Install ✅" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm install --frozen-lockfile ejecutado correctamente" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes que setup-node: la cache de pnpm necesita el binario ya en
      # PATH, y al reves el job moria con "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Resumen de CI
        run: |
          echo "## CI: Lint ✅" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm lint" >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes que setup-node: la cache de pnpm necesita el binario ya en
      # PATH, y al reves el job moria con "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm type-check

      - name: Resumen de CI
        run: |
          echo "## CI: Type-check ✅" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm type-check" >> $GITHUB_STEP_SUMMARY

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [type-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes que setup-node: la cache de pnpm necesita el binario ya en
      # PATH, y al reves el job moria con "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Con `pnpm test` a secas, Jest corre sin --coverage y el coverageThreshold
      # ni se evalua: el umbral era decorativo. Aqui si falla el job si la
      # cobertura baja del suelo declarado en jest.config.js.
      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Verify desktop session persistence
        run: pnpm --filter @erp-suite/web test:auth-session

      - name: Verify complete tenant catalog
        run: pnpm --filter @erp-suite/web test:tenant-catalog
      - name: Candidate profile contract
        run: pnpm --filter @erp-suite/web test:candidate-profile
      - name: Worker PROD-only configuration
        run: pnpm --filter @erp-suite/worker test:runtime-config

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-erp-api
          path: apps/erp-api/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Resumen de CI
        if: always()
        run: |
          echo "## CI: Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm test:cov (falla si la cobertura baja del suelo)" >> $GITHUB_STEP_SUMMARY
          if [ -f apps/erp-api/coverage/coverage-summary.json ]; then
            node -e "const t=require('./apps/erp-api/coverage/coverage-summary.json').total; for (const k of ['statements','branches','functions','lines']) console.log('- '+k+': '+t[k].pct+'%');" >> $GITHUB_STEP_SUMMARY
          fi

  database-contracts:
    name: PostgreSQL 16 fresh schema + SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [install]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_e2e
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_EPHEMERAL_LOCAL_DB: "1"
      REQUIRED_DATABASE_SCHEMA_VERSION: "555"
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5442
      PGUSER: postgres
      PGDATABASE: erp_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure PostgreSQL 16 client
        run: |
          if ! command -v psql >/dev/null || ! psql --version | grep -q ' 16\.'; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          psql --version

      - name: Rebuild and verify the required database contract
        run: node scripts/ci/verify-database-contracts.mjs

      - name: Database contract summary
        if: always()
        run: |
          echo "## PostgreSQL 16 schema gate" >> "$GITHUB_STEP_SUMMARY"
          echo '- Reconstrucción limpia de todas las migraciones.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Todos los verificadores SQL desde 491 hasta el esquema requerido, más los históricos vigentes.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Una migración nueva sin verificador del mismo prefijo falla el job.' >> "$GITHUB_STEP_SUMMARY"

  peru-integrated:
    name: Peru API, browser and backup recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Install Chromium
        run: pnpm --filter @erp-suite/web exec playwright install --with-deps chromium
      - name: Verify integrated Peru flows and recovery
        run: node scripts/ci/run-peru-integrated-local.mjs --records
      - name: Preserve local test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peru-integrated-local
          path: |
            artifacts/peru-integrated-*/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: error

  dian-official-contract:
    name: DIAN FEV 1.9 official XML contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java for official XSD validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate DIAN documents
        run: pnpm test:dian-contract

      - name: DIAN contract summary
        if: always()
        run: |
          echo "## DIAN FEV 1.9 official contract" >> "$GITHUB_STEP_SUMMARY"
          echo '- Fixture hashes, official XSD, compiled Schematron and production WSDL checked.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Invoice, credit/debit notes, FEV events 030-034 and AttachedDocument generated from production code.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, database-contracts, dian-official-contract, peru-integrated]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes que setup-node: la cache de pnpm necesita el binario ya en
      # PATH, y al reves el job moria con "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Build production API image
        run: docker build -f apps/erp-api/Dockerfile -t erp-peru-api-validation:ci .

      - name: Build and verify production worker image
        run: |
          docker build -f apps/worker/Dockerfile -t erp-peru-worker-validation:ci .
          node scripts/ci/verify-worker-image.mjs erp-peru-worker-validation:ci

      - name: Resumen de CI
        run: |
          echo "## CI: Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm build" >> $GITHUB_STEP_SUMMARY

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes que setup-node: la cache de pnpm necesita el binario ya en
      # PATH, y al reves el job moria con "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        shell: bash
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if output=$(pnpm audit --audit-level=high 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if ! grep -Eq 'ERR_SOCKET_TIMEOUT|ECONNRESET|ETIMEDOUT|EAI_AGAIN|error \(5[0-9]{2}\)' <<<"$output"; then
              exit "$status"
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              exit "$status"
            fi

            echo "Transient npm registry failure; retrying audit ($attempt/$max_attempts)..."
            sleep $((attempt * 15))
          done

      - name: Resumen de CI
        run: |
          echo "## CI: Audit ✅" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm audit --audit-level=high" >> $GITHUB_STEP_SUMMARY
