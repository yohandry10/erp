name: E2E remoto deshabilitado

# Las specs existentes aprovisionan y modifican datos. DEV fue retirado y no se
# redirigen a PROD porque eso mezclaría QA sintético con clientes reales.
on:
  workflow_dispatch:

jobs:
  blocked:
    name: Bloqueado por contrato PROD-only
    runs-on: ubuntu-latest
    steps:
      - name: Explicar bloqueo
        run: |
          echo "## E2E remoto bloqueado" >> "$GITHUB_STEP_SUMMARY"
          echo "DEV está deshabilitado y las pruebas con escritura están prohibidas en PROD." >> "$GITHUB_STEP_SUMMARY"
