global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: erp-suite
    environment: local

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          app: observability

  - job_name: erp-api
    metrics_path: /api/metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - erp-api:3002
        labels:
          service: erp-api
          app: backend

  - job_name: erp-worker
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - worker:3050
        labels:
          service: erp-worker
          app: background-jobs

  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
          app: cache

  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter
          app: system
